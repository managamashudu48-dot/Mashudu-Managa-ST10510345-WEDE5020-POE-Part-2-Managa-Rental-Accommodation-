<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enquiry - Managa Rental Accommodation</title>

</head>

<body>

    <!--Website Header-->

    <header>

        <h1>Managa Rental Accommodation</h1>

        <p>
            Comfortable and affordable accommodation
        </p>

    </header>

    <!--Navigation Menu-->

    <nav>
         <a href="index.html">Home</a> 
        <a href="about.html">About Us</a> 
        <a href="services.html">Services</a> 
        <a href="enquiry.html">Enquiry</a> 
        <a href="contact.html">Contact</a>
        <a href="sitemap.html">Sitemap</a>

    </nav>

    <!--Main Content-->

    <main>

        <h2>Make an Enquiry</h2>

        <p>
            If you are Interested in our accommodation, please complete the form below and provide your details.
        </p>

        <!--Enquiry Form-->

        <form action="#" method="post">

            <!--Full Name-->

            <label for="fullname">
                Full Name:
            </label>

            <br>

            <input
                type="text"
                id="fullname"
                name="fullname"
                required
            >

            <br><br>

            <!--Email-->

            <label for="email">
                Email Address
            </label>

            <br>

            <input
               type="email"
               id="email"
               name="email"
               required
            >

            <br><br>

            <!--Phone-->

            <label for="phone">
                Phone Number:
            </label>

            <br>

            <input
               type="tel"
               id="phone"
               name="phone"
            >

            <br><br>

            <!--Accommodation Type-->

            <label for="accommodation">
                Accommodation Type:
            </label>

            <br>


            <select
               id="accommodation"
               name="accommodation"
            >

            <option value="">
                --Select an option--
            </option>

            <option value="Student">
                Student Accommodation
            </option>

            <option value="Family">
                Family Accommodation
            </option>

            <option value="professionals">
                Professionals Accommodation
            </option>

        </select>

        <br><br>

        <!--Preferred Move-in Date-->

        <label for="Move-in">
            Preferred Move-in Date:
        </label>

        <br>

        <input
           type="date"
           id="Move-in"
           name="Move-in"
        
        >

        <br><br>

        <!--Message-->


        <label for="message">
            Your Enquiry:
        </label>

        <br>

        <textarea
            id="message"
            name="message"
            rows="6"
            cols="40"
            placeholder="Tell us what accommodation you are looking for..."
        ></textarea>

        <br><br>

        <!--Submit Button-->

        <input
           type="submit"
           value="Submit Enquiry"
        >

        <!--Reset Button-->

        <input
           type="reset"
           value="Clear Form"
        >
         
        </form>

    </main>

    <!--Footer-->

    <footer>

        <p>
            &copy; 2018 Managa Rental Accommodation
        </p>

    </footer>
    
</body>

</html>
